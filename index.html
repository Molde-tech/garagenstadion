<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#17130f"><title>Garagenstadion</title><style>
:root{--bg:#17130f;--p:#251f18;--p2:#30271e;--l:#4b3b2b;--t:#f5ead8;--m:#b9a68c;--a:#e79a32;--r:#df6250;--g:#67bb7e;--b:#6da9dc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#100d0a,#21180f);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Arial}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:86px}.head{position:sticky;top:0;z-index:4;background:#17130ff5;border-bottom:1px solid var(--l);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:12px;background:var(--a);display:grid;place-items:center;font-size:24px;box-shadow:3px 3px #6d4017}.title{font-weight:950;text-transform:uppercase}.sub,.muted{font-size:12px;color:var(--m)}.content{padding:14px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:14px;margin-bottom:10px}.hero{background:linear-gradient(135deg,#3b2819,#211a14)}.hero h2{margin:0;color:#ffda8b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--p2)}.stat strong{display:block;font-size:20px;color:#ffda8b}.section{margin:20px 2px 9px;color:var(--a);font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.14em}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.grow{flex:1;min-width:0}.name{font-weight:900}.btn,.chip{border:0;border-radius:10px;padding:10px 11px;font-weight:850;cursor:pointer}.btn{background:var(--a);color:#211205}.chip,.btn.ghost{background:var(--p2);color:var(--t);border:1px solid var(--l)}.btn.red{background:var(--r);color:white}.btn.green{background:var(--g);color:#07190d}.btn.blue{background:var(--b);color:#07131e}.block{width:100%}.btnrow{display:flex;gap:7px;margin-top:9px}.btnrow>*{flex:1}.badge{font-size:10px;padding:3px 7px;border-radius:99px;background:#4b3623;color:#ffda8b;font-weight:900}.warn{border-color:var(--r);background:#4a201c}.danger{color:#ff7968;font-weight:900}.ok{color:var(--g);font-weight:900}.money{color:#ffda8b;font-weight:900}.tally{font-family:ui-monospace,Consolas,monospace;color:var(--a);font-weight:950;letter-spacing:2px;word-break:break-all}.line{padding:9px 0;border-bottom:1px solid var(--l)}.line:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;display:flex;background:#17130ff7;border-top:1px solid var(--l);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;border:0;background:transparent;color:var(--m);padding:6px 2px;font-size:10px;font-weight:900}.nav span{display:block;font-size:19px}.nav .active{color:var(--a);background:#e79a3217;border-radius:10px}.sheetBg{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#211a14;border:1px solid var(--l);border-radius:20px 20px 0 0;padding:17px 17px calc(20px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 12px;color:#ffda8b}label{display:block;font-size:11px;text-transform:uppercase;color:var(--m);font-weight:900;margin:10px 0 5px}input,select,textarea{width:100%;background:#120f0c;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:11px;font:inherit}.empty{text-align:center;color:var(--m);padding:28px}.event{border-left:4px solid var(--a)}@media(max-width:440px){.grid{grid-template-columns:1fr 1fr}.grid .stat:last-child{grid-column:1/-1}}
</style></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyDXzKjeyfGAybqM015oINBPqjLk1TedE68",authDomain:"vfb-westhofen-app.firebaseapp.com",projectId:"vfb-westhofen-app",storageBucket:"vfb-westhofen-app.firebasestorage.app",messagingSenderId:"405760041608",appId:"1:405760041608:web:bd3d572508cede413bf53d"};
const DOC_ID='garagenstadion',PRICE=1,WARN=10;let S={club:{name:'Garagenstadion',code:'',slogan:'Kaltgetränke · gute Leute · keine Ausreden'},users:[],drinks:[],cash:[],events:[],log:[],me:null,verified:false},tab='home',sheet='',edit='',ready=false,applying=false,ref=null,day='';
const E=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),eu=n=>Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}),me=()=>S.users.find(u=>u.id===S.me),role=()=>me()?.role,master=()=>role()==='master',canStripe=()=>['master','tablet'].includes(role());
function count(id,d=''){return S.drinks.filter(x=>x.user===id&&(!d||x.date===d)).length}function open(id){return S.drinks.filter(x=>x.user===id).reduce((a,x)=>a+Number(x.open||0),0)}function credit(id){return Number(S.users.find(x=>x.id===id)?.credit||0)}function totalOpen(){return S.users.reduce((a,u)=>a+open(u.id),0)}function totalCredit(){return S.users.reduce((a,u)=>a+credit(u.id),0)}function till(){return S.cash.reduce((a,x)=>a+Number(x.amount||0),0)}function tally(n){let s='';for(let i=1;i<=n;i++)s+=i%5===0?'┃ ': '│';return s||'–'}function log(kind,text,user=null,amount=null){S.log.push({id:uid(),ts:new Date().toISOString(),by:S.me,kind,text,user,amount});if(S.log.length>800)S.log=S.log.slice(-800)}
function save(){localStorage.setItem('garage_session',JSON.stringify({me:S.me,verified:S.verified}));if(!ready||applying)return;let d={...S};delete d.me;delete d.verified;ref.set({db:d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>alert('Speichern fehlgeschlagen: '+e.message))}function start(){firebase.initializeApp(firebaseConfig);ref=firebase.firestore().collection('apps').doc(DOC_ID);firebase.auth().signInAnonymously().then(()=>ref.onSnapshot(x=>{let z={};try{z=JSON.parse(localStorage.getItem('garage_session')||'{}')}catch(e){}applying=true;if(x.exists&&x.data().db)S={...S,...x.data().db,me:z.me||null,verified:!!z.verified};ready=true;applying=false;render()})).catch(e=>app.innerHTML='<div class="empty">Firebase-Fehler: '+esc(e.message)+'</div>')}
function nav(){let a=[['home','🏚️','Start'],['striche','𝍷','Striche'],['kasse','💶','Kasse'],['termine','📅','Termine'],['leute','👥','Leute']];if(master())a.push(['protokoll','📋','Protokoll']);return `<nav class="nav">${a.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';sheet='';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function layout(b){return `<div class="app"><header class="head"><div class="brand"><div class="logo">🍺</div><div><div class="title">${esc(S.club.name)}</div><div class="sub">${esc(S.club.slogan)}</div></div></div><button class="chip" onclick="show('profile')">${esc(me()?.name||'Profil')}</button></header><main class="content">${b}</main>${nav()}${modal()}</div>`}
function summary(){return `<div class="grid"><div class="card stat"><span class="muted">Offen gesamt</span><strong class="danger">${eu(totalOpen())}</strong></div><div class="card stat"><span class="muted">Guthaben gesamt</span><strong>${eu(totalCredit())}</strong></div><div class="card stat"><span class="muted">Bierkasse</span><strong>${eu(till())}</strong></div></div>`}function account(u){let o=open(u.id),c=credit(u.id);return `<div class="card ${o>=WARN?'warn':''}"><div class="row"><div><div class="name">${esc(u.name)}</div><span class="badge">${u.role==='master'?'Garagenmeister':u.role==='tablet'?'Tablet':'Mitglied'}</span></div><div style="text-align:right"><div class="money">Guthaben ${eu(c)}</div><div class="${o>=WARN?'danger':'muted'}">Offen ${eu(o)}</div></div></div>${o>=WARN?`<p class="danger">⚠ Offener Betrag hat ${eu(WARN)} erreicht.</p>`:''}${canStripe()&&u.role!=='tablet'?`<div class="btnrow"><button class="btn" onclick="addDrink('${u.id}')">🍺 +1 Strich</button>${master()?`<button class="btn blue" onclick="show('deposit','${u.id}')">+ Guthaben</button>`:''}</div>`:''}</div>`}
function home(){let u=me(),next=[...S.events].filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];if(role()==='tablet')return `<div class="hero"><h2>Tablet-Modus</h2><p class="muted">Mitglied antippen und einen Strich buchen.</p></div>${summary()}<div class="section">Strich buchen</div>${S.users.filter(x=>x.role!=='tablet').map(account).join('')}`;return `<div class="hero"><h2>Willkommen, ${esc(u.name)}</h2><div class="muted">${master()?'Vollzugriff als Garagenmeister':'Dein persönlicher Überblick'}</div></div>${master()?summary():account(u)}${master()?`<div class="section">Alle Konten</div>${S.users.filter(x=>x.role!=='tablet').map(account).join('')}`:''}<div class="section">Nächster Termin</div>${next?eventCard(next):'<div class="card muted">Noch kein Termin.</div>'}`}
function striche(){let days=[...new Set(S.drinks.map(x=>x.date))].sort().reverse();return `<div class="section">Strichliste</div><div class="card"><label>Tag</label><select onchange="day=this.value;render()"><option value="">Gesamt</option>${days.map(d=>`<option value="${d}" ${day===d?'selected':''}>${fmt(d)}</option>`).join('')}</select></div>${S.users.filter(x=>x.role!=='tablet').map(u=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(u.name)}</div><div class="tally">${tally(count(u.id,day))}</div><div class="muted">${count(u.id,day)} Striche · offen ${eu(open(u.id))} · Guthaben ${eu(credit(u.id))}</div></div>${canStripe()?`<button class="btn" onclick="addDrink('${u.id}')">+1</button>`:''}</div>${master()&&count(u.id)?`<button class="btn red block" style="margin-top:8px" onclick="removeLast('${u.id}')">Letzten Strich korrigieren</button>`:''}</div>`).join('')}`}
function cashList(){return [...S.cash].sort((a,b)=>b.ts.localeCompare(a.ts)).map(x=>{let u=S.users.find(z=>z.id===x.user);return `<div class="line row"><div><b>${esc(x.note)}</b><div class="muted">${new Date(x.ts).toLocaleString('de-DE')}${u?' · '+esc(u.name):''}</div></div><span class="${x.amount>=0?'ok':'danger'}">${x.amount>=0?'+':''}${eu(x.amount)}</span></div>`}).join('')||'<div class="empty">Noch keine Buchungen.</div>'}function kasse(){let u=me();if(!master())return `<div class="section">Mein Konto</div>${account(u)}<div class="card"><div class="row"><span>Bierkasse insgesamt</span><b>${eu(till())}</b></div></div>`;return `<div class="section">Kassenübersicht</div>${summary()}<div class="btnrow"><button class="btn blue" onclick="show('deposit')">Guthaben einzahlen</button><button class="btn" onclick="show('special')">Ein-/Ausgabe</button></div><div class="section">Buchungen</div><div class="card">${cashList()}</div>`}
function eventCard(e){return `<div class="card event row"><div><b>${esc(e.title)}</b><div class="muted">${fmt(e.date)}${e.time?' · '+esc(e.time)+' Uhr':''}${e.place?' · '+esc(e.place):''}</div>${e.note?`<div>${esc(e.note)}</div>`:''}</div>${master()?`<button class="btn red" onclick="delEvent('${e.id}')">×</button>`:''}</div>`}function termine(){let l=[...S.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="section">Termine</div>${l.map(eventCard).join('')||'<div class="empty">Keine Termine.</div>'}${master()?`<button class="btn block" onclick="show('event')">+ Termin</button>`:''}`}
function leute(){return `<div class="section">Benutzer</div>${S.users.map(u=>`<div class="card row"><div><div class="name">${esc(u.name)}</div><span class="badge">${u.role==='master'?'Garagenmeister':u.role==='tablet'?'Tablet-Account':'Mitglied'}</span></div>${master()&&u.id!==S.me?`<div><button class="btn ghost" onclick="show('editUser','${u.id}')">Ändern</button></div>`:''}</div>`).join('')}${master()?`<div class="btnrow"><button class="btn" onclick="show('user')">+ Mitglied</button>${S.users.some(x=>x.role==='tablet')?'':`<button class="btn blue" onclick="show('tablet')">+ Tablet</button>`}</div>`:''}`}
function protokoll(){if(!master())return'';let l=[...S.log].sort((a,b)=>b.ts.localeCompare(a.ts));return `<div class="section">Protokoll</div><div class="card">${l.map(x=>{let by=S.users.find(u=>u.id===x.by),u=S.users.find(u=>u.id===x.user);return `<div class="line"><b>${esc(x.text)}</b><div class="muted">${new Date(x.ts).toLocaleString('de-DE')}${u?' · '+esc(u.name):''} · von ${esc(by?.name||'System')}</div></div>`}).join('')||'<div class="empty">Noch keine Einträge.</div>'}</div>`}
function login(){if(!S.users.length)return `<div class="app"><main class="content"><div class="hero"><h2>Garagenstadion eröffnen</h2><label>Name</label><input id="club" value="Garagenstadion"><label>Dein Name</label><input id="owner"><label>PIN</label><input id="pin" type="password"><button class="btn block" style="margin-top:10px" onclick="create()">Eröffnen</button></div></main></div>`;if(!S.verified)return `<div class="app"><main class="content"><div class="hero"><h2>Einladungscode</h2><input id="code"><button class="btn block" style="margin-top:10px" onclick="verify()">Weiter</button></div></main></div>`;if(!me())return `<div class="app"><main class="content"><div class="hero"><h2>Benutzer wählen</h2>${S.users.map(u=>`<button class="chip block" style="margin-top:7px" onclick="showLogin('${u.id}')">${esc(u.name)} · ${u.role==='tablet'?'Tablet':u.role==='master'?'Garagenmeister':'Mitglied'}</button>`).join('')}</div>${modal()}</main></div>`;return null}function render(){if(!ready)return app.innerHTML='<div class="empty">Lade…</div>';let l=login();if(l)return app.innerHTML=l;let b=tab==='home'?home():tab==='striche'?striche():tab==='kasse'?kasse():tab==='termine'?termine():tab==='leute'?leute():protokoll();app.innerHTML=layout(b)}function show(s,id=''){sheet=s;edit=id;render()}function close(){sheet='';edit='';render()}function showLogin(id){sheet='login';edit=id;render()}
function modal(){if(!sheet)return'';let b='';if(sheet==='login'){let u=S.users.find(x=>x.id===edit);b=`<h3>${esc(u?.name)}</h3><label>PIN</label><input id="lp" type="password"><button class="btn block" onclick="doLogin()">Anmelden</button>`}if(sheet==='profile')b=`<h3>Profil</h3><div class="card"><b>${esc(me()?.name)}</b><div class="muted">${role()}</div></div>${master()?`<label>Einladungscode</label><input readonly value="${esc(S.club.code)}" onclick="this.select()">`:''}<button class="btn ghost block" onclick="S.me=null;save();close()">Benutzer wechseln</button>`;if(sheet==='user'||sheet==='tablet')b=`<h3>${sheet==='tablet'?'Tablet-Account':'Mitglied'} anlegen</h3><label>Name</label><input id="un" value="${sheet==='tablet'?'Garagen-Tablet':''}"><label>PIN</label><input id="up" value="1234"><button class="btn block" onclick="addUser('${sheet==='tablet'?'tablet':'member'}')">Anlegen</button>`;if(sheet==='editUser'){let u=S.users.find(x=>x.id===edit);b=`<h3>Benutzer bearbeiten</h3><label>Name</label><input id="en" value="${esc(u.name)}"><label>Neue PIN (optional)</label><input id="ep"><label>Rolle</label><select id="er"><option value="member" ${u.role==='member'?'selected':''}>Mitglied</option><option value="tablet" ${u.role==='tablet'?'selected':''}>Tablet</option><option value="master" ${u.role==='master'?'selected':''}>Garagenmeister</option></select><button class="btn block" onclick="editUser()">Speichern</button><button class="btn red block" style="margin-top:8px" onclick="delUser('${u.id}')">Löschen</button>`}if(sheet==='deposit'){let sel=edit||S.users.find(x=>x.role!=='tablet')?.id;b=`<h3>Guthaben einzahlen</h3><label>Mitglied</label><select id="du">${S.users.filter(x=>x.role!=='tablet').map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)}</option>`).join('')}</select><label>Betrag</label><input id="da" type="number" min="0.01" step="0.5"><label>Notiz</label><input id="dn" value="Guthaben-Einzahlung"><button class="btn blue block" onclick="deposit()">Einzahlen</button>`}if(sheet==='special')b=`<h3>Bierkasse buchen</h3><label>Art</label><select id="st"><option value="in">Einnahme</option><option value="out">Ausgabe</option></select><label>Betrag</label><input id="sa" type="number" min="0.01" step="0.01"><label>Grund</label><input id="sn" placeholder="Getränkeeinkauf …"><button class="btn block" onclick="special()">Buchen</button>`;if(sheet==='event')b=`<h3>Termin</h3><label>Titel</label><input id="et"><label>Datum</label><input id="ed" type="date" value="${today()}"><label>Uhrzeit</label><input id="ei" type="time"><label>Ort</label><input id="epl" value="Garagenstadion"><label>Notiz</label><textarea id="eno"></textarea><button class="btn block" onclick="addEvent()">Speichern</button>`;return `<div class="sheetBg" onclick="close()"><div class="sheet" onclick="event.stopPropagation()">${b}<button class="btn ghost block" style="margin-top:8px" onclick="close()">Schließen</button></div></div>`}
function create(){let n=E('owner').value.trim(),p=E('pin').value.trim();if(!n||p.length<4)return alert('Name und PIN mit mind. 4 Zeichen.');let id=uid();S.club.name=E('club').value.trim()||'Garagenstadion';S.club.code=Math.random().toString(36).slice(2,8).toUpperCase();S.users=[{id,name:n,pin:p,role:'master',credit:0}];S.me=id;S.verified=true;log('system','Garagenstadion eröffnet',id);save();render()}function verify(){if(E('code').value.trim().toUpperCase()!==S.club.code)return alert('Code falsch.');S.verified=true;save();render()}function doLogin(){let u=S.users.find(x=>x.id===edit);if(!u||String(u.pin)!==E('lp').value)return alert('PIN falsch.');S.me=u.id;save();close()}function addUser(r){let n=E('un').value.trim(),p=E('up').value.trim();if(!n||p.length<4)return alert('Name/PIN fehlt.');let id=uid();S.users.push({id,name:n,pin:p,role:r,credit:0});log('user',(r==='tablet'?'Tablet-Account':'Mitglied')+' angelegt',id);save();close()}function editUser(){let u=S.users.find(x=>x.id===edit);u.name=E('en').value.trim();if(E('ep').value.trim())u.pin=E('ep').value.trim();u.role=E('er').value;log('user','Benutzer geändert',u.id);save();close()}function delUser(id){if(!confirm('Benutzer und alle zugehörigen Striche löschen?'))return;let u=S.users.find(x=>x.id===id);log('user','Benutzer gelöscht: '+(u?.name||''),id);S.users=S.users.filter(x=>x.id!==id);S.drinks=S.drinks.filter(x=>x.user!==id);save();close()}
function addDrink(id){if(!canStripe())return;let u=S.users.find(x=>x.id===id),use=Math.min(Number(u.credit||0),PRICE);u.credit=Number(u.credit||0)-use;S.drinks.push({id:uid(),user:id,date:today(),price:PRICE,creditUsed:use,open:PRICE-use,by:S.me,ts:new Date().toISOString()});log('drink','1 Bier eingetragen'+(use?' · vom Guthaben abgerechnet':''),id,PRICE);save();render()}function removeLast(id){if(!master())return;let a=S.drinks.filter(x=>x.user===id).sort((x,y)=>y.ts.localeCompare(x.ts))[0];if(!a)return;let u=S.users.find(x=>x.id===id);u.credit=Number(u.credit||0)+Number(a.creditUsed||0);S.drinks=S.drinks.filter(x=>x.id!==a.id);log('drink','Letzten Strich korrigiert/entfernt',id,a.price);save();render()}function deposit(){let id=E('du').value,a=Number(E('da').value),n=E('dn').value.trim()||'Guthaben-Einzahlung';if(a<=0)return alert('Betrag fehlt.');let u=S.users.find(x=>x.id===id),remaining=a;S.drinks.filter(x=>x.user===id&&x.open>0).sort((x,y)=>x.ts.localeCompare(y.ts)).forEach(x=>{let q=Math.min(remaining,x.open);x.open-=q;x.creditUsed+=q;remaining-=q});u.credit=Number(u.credit||0)+remaining;S.cash.push({id:uid(),user:id,amount:a,note:n,type:'deposit',ts:new Date().toISOString(),by:S.me});log('cash','Guthaben eingezahlt: '+eu(a),id,a);save();close()}function special(){let a=Math.abs(Number(E('sa').value)),n=E('sn').value.trim();if(!a||!n)return alert('Betrag und Grund fehlen.');if(E('st').value==='out')a=-a;S.cash.push({id:uid(),amount:a,note:n,type:'special',ts:new Date().toISOString(),by:S.me});log('cash',(a>0?'Einnahme: ':'Ausgabe: ')+n+' '+eu(a),null,a);save();close()}function addEvent(){let t=E('et').value.trim(),d=E('ed').value;if(!t||!d)return alert('Titel und Datum fehlen.');let id=uid();S.events.push({id,title:t,date:d,time:E('ei').value,place:E('epl').value.trim(),note:E('eno').value.trim()});log('event','Termin angelegt: '+t);save();close()}function delEvent(id){let e=S.events.find(x=>x.id===id);if(confirm('Termin löschen?')){S.events=S.events.filter(x=>x.id!==id);log('event','Termin gelöscht: '+(e?.title||''));save();render()}}
start();</script></body></html>
