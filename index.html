<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#17130f"><title>Garagenstadion</title>
<style>
:root{--bg:#17130f;--panel:#251f18;--panel2:#30271e;--line:#4b3b2b;--text:#f5ead8;--muted:#b9a68c;--amber:#e79a32;--cream:#ffdb8a;--red:#d95845;--green:#63b77b;--blue:#6aa6d9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#100d0a,#21180f);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial}.app{max-width:600px;margin:auto;min-height:100vh;padding-bottom:84px}.head{position:sticky;top:0;z-index:4;background:rgba(23,19,15,.96);backdrop-filter:blur(9px);border-bottom:1px solid var(--line);padding:13px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:46px;height:46px;border-radius:12px;background:var(--amber);color:#23150a;display:grid;place-items:center;font-size:25px;transform:rotate(-2deg);box-shadow:3px 3px 0 #6e4016}.title{font-weight:950;text-transform:uppercase;letter-spacing:.04em}.sub{font-size:11px;color:var(--muted)}.chip,.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:850}.chip{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.content{padding:14px}.hero{border:1px solid #674724;background:linear-gradient(135deg,#3a2718,#211a14);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 7px 22px #0005}.hero h2{margin:0;color:var(--cream)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.stat{background:var(--panel2)}.stat strong{display:block;font-size:24px;color:var(--cream)}.muted{color:var(--muted);font-size:13px}.section{margin:20px 2px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--amber);font-weight:950}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grow{flex:1;min-width:0}.name{font-weight:900}.btn{background:var(--amber);color:#211205;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.red{background:var(--red);color:white}.btn.green{background:var(--green);color:#07190c}.btn.block{width:100%}.btnrow{display:flex;gap:7px;margin-top:10px}.btnrow>*{flex:1}.tally{font-family:ui-monospace,Consolas,monospace;color:var(--amber);font-weight:950;letter-spacing:2px;word-break:break-all}.badge{font-size:10px;padding:3px 7px;border-radius:99px;background:#4a3522;color:var(--cream);font-weight:900}.nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;display:flex;background:#17130ff5;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px;font-weight:900}.nav button span{display:block;font-size:20px}.nav button.active{color:var(--amber);background:#e79a3217;border-radius:10px}.sheetBg{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:600px;max-height:90vh;overflow:auto;background:#211a14;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:17px 17px calc(20px + env(safe-area-inset-bottom))}.sheet h3{margin-top:0;color:var(--cream)}label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:900;margin:11px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#120f0c;color:var(--text);padding:12px;font:inherit}.empty{text-align:center;color:var(--muted);padding:30px}.danger{color:#ff7968}.ok{color:var(--green)}.event{border-left:4px solid var(--amber)}.hidden{display:none!important}@media(max-width:390px){.grid{grid-template-columns:1fr}.title{font-size:14px}}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>
// Gleiches Firebase-Projekt wie die VfB-App, aber eigenes Dokument: apps/garagenstadion
const firebaseConfig={apiKey:"AIzaSyDXzKjeyfGAybqM015oINBPqjLk1TedE68",authDomain:"vfb-westhofen-app.firebaseapp.com",projectId:"vfb-westhofen-app",storageBucket:"vfb-westhofen-app.firebasestorage.app",messagingSenderId:"405760041608",appId:"1:405760041608:web:bd3d572508cede413bf53d"};
const DOC_ID='garagenstadion', BEER_PRICE=1;
let state={club:{name:'Garagenstadion',code:'GARAGE',slogan:'Kaltgetränke · gute Leute · keine Ausreden'},members:[],beers:[],events:[],notes:[],me:null,verified:false},tab='home',sheet=null,edit=null,ready=false,applying=false,doc=null;
const $=id=>document.getElementById(id), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function tally(n){let s='';for(let i=1;i<=n;i++)s+=i%5===0?'┃ ': '│';return s||'–'}function me(){return state.members.find(x=>x.id===state.me)}function admin(){return me()?.role==='admin'}function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}function beerCount(id,day=''){return state.beers.filter(x=>x.member===id&&(!day||x.date===day)).length}function openValue(id){return state.beers.filter(x=>x.member===id&&!x.paid).reduce((s,x)=>s+Number(x.price||BEER_PRICE),0)}function euro(n){return Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function save(){localStorage.setItem('garage_session',JSON.stringify({me:state.me,verified:state.verified}));if(!ready||applying)return;let cloud={...state};delete cloud.me;delete cloud.verified;doc.set({db:cloud,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:false}).catch(e=>alert('Speichern fehlgeschlagen: '+e.message))}
function start(){firebase.initializeApp(firebaseConfig);doc=firebase.firestore().collection('apps').doc(DOC_ID);firebase.auth().signInAnonymously().then(()=>doc.onSnapshot(s=>{applying=true;let session={};try{session=JSON.parse(localStorage.getItem('garage_session')||'{}')}catch(e){}if(s.exists&&s.data().db)state={...state,...s.data().db,me:session.me||null,verified:!!session.verified};ready=true;applying=false;render()})).catch(e=>document.getElementById('app').innerHTML='<div class="empty">Firebase-Fehler: '+esc(e.message)+'</div>')}
function layout(body){return `<div class="app"><header class="head"><div class="brand"><div class="logo">🍺</div><div><div class="title">${esc(state.club.name)}</div><div class="sub">${esc(state.club.slogan)}</div></div></div>${me()?`<button class="chip" onclick="show('profile')">${esc(me().name.split(' ')[0])}</button>`:''}</header><main class="content">${body}</main>${nav()}${sheetView()}</div>`}
function nav(){let n=[['home','🏚️','Zentrale'],['striche','𝍷','Striche'],['termine','📅','Termine'],['mitglieder','👥','Leute']];return `<nav class="nav">${n.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';sheet=null;render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function home(){let total=state.beers.length,open=state.members.reduce((s,m)=>s+openValue(m.id),0),next=[...state.events].filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];return `<div class="hero"><h2>Willkommen im Garagenstadion</h2><div class="muted">${esc(state.club.slogan)}</div></div><div class="grid"><div class="card stat"><span class="muted">Getränke gesamt</span><strong>${total}</strong></div><div class="card stat"><span class="muted">Offen</span><strong>${euro(open)}</strong></div></div><div class="section">Schnelle Runde</div><div class="card">${state.members.map(m=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><div class="name">${esc(m.name)}</div><div class="muted">${beerCount(m.id)} Striche · offen ${euro(openValue(m.id))}</div></div>${admin()?`<button class="btn" onclick="addBeer('${m.id}')">🍺 +1</button>`:''}</div>`).join('')||'<div class="empty">Noch keine Mitglieder.</div>'}</div><div class="section">Nächster Termin</div>${next?eventCard(next):'<div class="card muted">Noch kein Termin angelegt.</div>'}${admin()?`<button class="btn block" onclick="show('notice')">📌 Nachricht ans schwarze Brett</button>`:''}<div class="section">Schwarzes Brett</div>${state.notes.slice().reverse().slice(0,5).map(n=>`<div class="card"><b>${esc(n.text)}</b><div class="muted">${fmt(n.date)}</div></div>`).join('')||'<div class="card muted">Noch leer.</div>'}`}
function striche(){let days=[...new Set(state.beers.map(b=>b.date))].sort().reverse(),day=window.filterDay||'';return `<div class="section">Strichliste</div><div class="card"><label>Zeitraum</label><select onchange="window.filterDay=this.value;render()"><option value="">Gesamt</option>${days.map(d=>`<option value="${d}" ${day===d?'selected':''}>${fmt(d)}</option>`).join('')}</select></div>${state.members.map(m=>{let c=beerCount(m.id,day);return `<div class="card"><div class="row"><div class="grow"><div class="name">${esc(m.name)}</div><div class="tally">${tally(c)}</div><div class="muted">${c} Getränk${c===1?'':'e'} · offen ${euro(openValue(m.id))}</div></div>${admin()?`<button class="btn" onclick="addBeer('${m.id}')">+1</button>`:''}</div></div>`}).join('')}${admin()?`<button class="btn green block" onclick="settleAll()">Alle offenen Striche als bezahlt markieren</button>`:''}`}
function eventCard(e){return `<div class="card event"><div class="row"><div><b>${esc(e.title)}</b><div class="muted">${fmt(e.date)}${e.time?' · '+esc(e.time)+' Uhr':''}${e.place?' · '+esc(e.place):''}</div></div>${admin()?`<button class="btn red" onclick="delEvent('${e.id}')">×</button>`:''}</div>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`}
function termine(){let list=[...state.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="section">Termine</div>${list.map(eventCard).join('')||'<div class="empty">Keine Termine.</div>'}${admin()?`<button class="btn block" onclick="show('event')">+ Termin anlegen</button>`:''}`}
function mitglieder(){return `<div class="section">Mitglieder</div>${state.members.map(m=>`<div class="card row"><div><div class="name">${esc(m.name)}</div><span class="badge">${m.role==='admin'?'Garagenmeister':'Mitglied'}</span></div>${admin()&&m.id!==state.me?`<button class="btn red" onclick="delMember('${m.id}')">Entfernen</button>`:''}</div>`).join('')}${admin()?`<button class="btn block" onclick="show('member')">+ Mitglied</button>`:''}`}
function loginViews(){if(!state.members.length)return `<div class="app"><main class="content"><div class="hero"><h2>Garagenstadion eröffnen</h2><p class="muted">Der erste Benutzer wird Garagenmeister.</p><label>Name der Höhle</label><input id="clubName" value="Garagenstadion"><label>Dein Name</label><input id="owner"><label>PIN</label><input id="pin" type="password"><button class="btn block" style="margin-top:12px" onclick="createClub()">Eröffnen</button></div></main></div>`;if(!state.verified)return `<div class="app"><main class="content"><div class="hero"><h2>Einladungscode</h2><label>Code</label><input id="invite"><button class="btn block" style="margin-top:12px" onclick="verify()">Weiter</button></div></main></div>`;if(!me())return `<div class="app"><main class="content"><div class="hero"><h2>Wer bist du?</h2>${state.members.map(m=>`<button class="chip block" style="margin-top:8px" onclick="showLogin('${m.id}')">${esc(m.name)}</button>`).join('')}</div>${sheetView()}</main></div>`;return null}
function render(){if(!ready)return app.innerHTML='<div class="empty">Lade Garagenstadion…</div>';let l=loginViews();if(l)return app.innerHTML=l;app.innerHTML=layout(tab==='home'?home():tab==='striche'?striche():tab==='termine'?termine():mitglieder())}
function show(s){sheet=s;edit=null;render()}function closeSheet(){sheet=null;edit=null;render()}function showLogin(id){sheet='login';edit=id;render()}
function sheetView(){if(!sheet)return'';let body='';if(sheet==='login'){let m=state.members.find(x=>x.id===edit);body=`<h3>Anmelden: ${esc(m?.name)}</h3><label>PIN</label><input id="loginPin" type="password"><button class="btn block" onclick="doLogin()">Anmelden</button>`}if(sheet==='member')body=`<h3>Mitglied hinzufügen</h3><label>Name</label><input id="memberName"><label>Start-PIN</label><input id="memberPin" value="1234"><button class="btn block" onclick="addMember()">Hinzufügen</button>`;if(sheet==='event')body=`<h3>Termin anlegen</h3><label>Titel</label><input id="evTitle" placeholder="Grillabend, Spiel gucken …"><label>Datum</label><input id="evDate" type="date" value="${today()}"><label>Uhrzeit</label><input id="evTime" type="time"><label>Ort</label><input id="evPlace" value="Garagenstadion"><label>Notiz</label><textarea id="evNote"></textarea><button class="btn block" onclick="addEvent()">Speichern</button>`;if(sheet==='notice')body=`<h3>Schwarzes Brett</h3><label>Nachricht</label><textarea id="noticeText" placeholder="Getränke werden knapp …"></textarea><button class="btn block" onclick="addNotice()">Anheften</button>`;if(sheet==='profile')body=`<h3>Profil</h3><div class="card"><b>${esc(me()?.name)}</b><div class="muted">${me()?.role==='admin'?'Garagenmeister':'Mitglied'}</div></div><button class="btn secondary block" onclick="state.me=null;save();closeSheet()">Benutzer wechseln</button><button class="btn red block" style="margin-top:8px" onclick="state.me=null;state.verified=false;save();closeSheet()">Abmelden</button>`;return `<div class="sheetBg" onclick="closeSheet()"><div class="sheet" onclick="event.stopPropagation()">${body}<button class="btn secondary block" style="margin-top:8px" onclick="closeSheet()">Schließen</button></div></div>`}
function createClub(){let n=$('owner').value.trim(),p=$('pin').value.trim();if(!n||p.length<4)return alert('Name und PIN (mind. 4 Zeichen) eingeben.');let id=uid();state.club.name=$('clubName').value.trim()||'Garagenstadion';state.club.code=Math.random().toString(36).slice(2,8).toUpperCase();state.members=[{id,name:n,pin:p,role:'admin'}];state.me=id;state.verified=true;save();render()}function verify(){if($('invite').value.trim().toUpperCase()!==state.club.code)return alert('Code falsch.');state.verified=true;save();render()}function doLogin(){let m=state.members.find(x=>x.id===edit);if(!m||String(m.pin)!==$('loginPin').value)return alert('PIN falsch.');state.me=m.id;save();closeSheet()}function addMember(){let n=$('memberName').value.trim(),p=$('memberPin').value.trim();if(!n||p.length<4)return alert('Name und PIN fehlen.');state.members.push({id:uid(),name:n,pin:p,role:'member'});save();closeSheet()}function delMember(id){if(confirm('Mitglied und zugehörige Striche wirklich löschen?')){state.members=state.members.filter(x=>x.id!==id);state.beers=state.beers.filter(x=>x.member!==id);save();render()}}function addBeer(id){state.beers.push({id:uid(),member:id,date:today(),price:BEER_PRICE,paid:false,by:state.me,ts:new Date().toISOString()});save();render()}function settleAll(){if(!confirm('Alle offenen Getränke als bezahlt markieren?'))return;state.beers.forEach(x=>x.paid=true);save();render()}function addEvent(){let title=$('evTitle').value.trim();if(!title||!$('evDate').value)return alert('Titel und Datum fehlen.');state.events.push({id:uid(),title,date:$('evDate').value,time:$('evTime').value,place:$('evPlace').value.trim(),note:$('evNote').value.trim()});save();closeSheet()}function delEvent(id){if(confirm('Termin löschen?')){state.events=state.events.filter(x=>x.id!==id);save();render()}}function addNotice(){let t=$('noticeText').value.trim();if(!t)return;state.notes.push({id:uid(),text:t,date:today(),by:state.me});save();closeSheet()}
start();
</script></body></html>
